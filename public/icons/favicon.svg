<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <title>ระบบแจ้งเตือนผลการดำเนินงาน กยท.</title>
  <!--
    โครงสร้างแบบเดียวกับไอคอน Google Chrome:
      วงนอกเขียว กยท.  ->  วงในขาว  ->  หยดน้ำยางสีทองบนพื้นขาว

    พื้นนอกวงกลมโปร่งใส ไม่ใช่สี่เหลี่ยมขาว ไอคอนจึงเป็นวงกลมจริง
    วางบนพื้นสีอะไรก็ได้

    วงในขาวรัศมี 16.5 เหลือขอบเขียวหนา 7.5 หน่วย (~2.5px ที่ขนาด 16px)
    บางกว่านี้ขอบเขียวจะหายไปตอนย่อ เหลือเป็นวงขาวเปล่า ๆ

    ทองเข้มกว่าตัวแปร --gold ของเว็บ (#b8892b) เพราะหยดวางบนพื้นขาว
    ถ้าใช้ทองอ่อนกว่านี้จะจางจนแทบไม่เห็นตอนย่อลง 16px

    ⚠️ ต้องตรงกับ build/make-icons.ps1 เป๊ะ ๆ — เบราว์เซอร์ใหม่ใช้ไฟล์นี้
    เบราว์เซอร์เก่าใช้ PNG ถ้าไม่เหมือนกันผู้ใช้จะเห็นไอคอนสลับไปมา
  -->
  <circle cx="24" cy="24" r="24" fill="#0a4227" />
  <circle cx="24" cy="24" r="16.5" fill="#ffffff" />
  <path
    d="M24 11.5C24 11.5 34.5 24 34.5 27.5A10.5 10.5 0 1 1 13.5 27.5C13.5 24 24 11.5 24 11.5Z"
    fill="#e08a14"
  />
</svg>
