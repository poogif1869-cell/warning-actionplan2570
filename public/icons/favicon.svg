<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <title>ระบบแจ้งเตือนผลการดำเนินงาน กยท.</title>
  <!--
    favicon แสดงจริงที่ 16x16 px รายละเอียดของตราสัญลักษณ์เต็ม (เส้นใบยาง ขอบวง
    ตัวอักษร) จะเละหมดที่ขนาดนั้น จึงเหลือไว้แค่ "หยดน้ำยาง" ซึ่งเป็นรูปทรง
    ที่เด่นและจำได้ที่สุดในตรา วางบนวงกลมเขียวของ กยท.

    ไม่มีเส้นขอบบาง ๆ และไม่มีไล่เฉดสี เพราะที่ 16px จะกลายเป็นสีเทาขุ่น
    สีทองใช้โทนสดกว่าตัวแปร --gold ของเว็บ เพราะพื้นที่เล็กมากต้องการคอนทราสต์สูง

    ไม่ปรับตามโหมดมืด/สว่าง — แท็บเบราว์เซอร์มีทั้งพื้นอ่อนและพื้นเข้ม
    วงกลมเขียวทึบอ่านออกได้ทั้งสองแบบอยู่แล้ว
  -->
  <circle cx="24" cy="24" r="24" fill="#0a4227" />
  <path
    d="M24 7 C24 7 37 23 37 29 A13 13 0 1 1 11 29 C11 23 24 7 24 7 Z"
    fill="#f0a92b"
  />
</svg>
