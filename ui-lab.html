<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ห้องแล็บชิ้นส่วน UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">

</head>
<body>

<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --paper:#f4f5f7;
  --stage:#ffffff;
  --stage-2:#fafbfc;
  --ink:#151821;
  --ink-2:#3d4454;
  --muted:#6a7183;
  --line:#dde0e7;
  --line-soft:#eaecf1;
  --accent:#1d4ed8;
  --accent-ink:#ffffff;
  --accent-soft:rgba(29,78,216,.09);
  --accent-line:rgba(29,78,216,.40);
  --measure:#0d7f6f;
  --measure-soft:rgba(13,127,111,.10);
  --ok:#0f7b4f;
  --ok-soft:rgba(15,123,79,.10);
  --warn:#9a6200;
  --warn-soft:rgba(154,98,0,.12);
  --danger:#c42b1c;
  --danger-soft:rgba(196,43,28,.10);
  --grid-dot:rgba(21,24,33,.075);
  --skeleton-a:#e7e9ee;
  --skeleton-b:#f2f4f7;
  --shadow-1:0 1px 2px rgba(21,24,33,.07);
  --shadow-2:0 4px 14px rgba(21,24,33,.09),0 1px 3px rgba(21,24,33,.05);
  --shadow-3:0 18px 44px rgba(21,24,33,.17),0 4px 10px rgba(21,24,33,.08);

  --font-display:'Bai Jamjuree','IBM Plex Sans Thai',system-ui,sans-serif;
  --font-body:'IBM Plex Sans Thai',system-ui,-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono','IBM Plex Sans Thai','SF Mono',Menlo,monospace;

  --r-sm:6px; --r-md:10px; --r-lg:16px;
  --rail:52px;
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0e1015;
    --stage:#171a21;
    --stage-2:#1d2129;
    --ink:#edeff4;
    --ink-2:#c3c9d6;
    --muted:#98a0b0;
    --line:#2a2f3a;
    --line-soft:#232833;
    --accent:#7ab0ff;
    --accent-ink:#07182e;
    --accent-soft:rgba(122,176,255,.15);
    --accent-line:rgba(122,176,255,.5);
    --measure:#4fd1bd;
    --measure-soft:rgba(79,209,189,.14);
    --ok:#4ade9b;
    --ok-soft:rgba(74,222,155,.13);
    --warn:#e5a53a;
    --warn-soft:rgba(229,165,58,.14);
    --danger:#ff7a6b;
    --danger-soft:rgba(255,122,107,.13);
    --grid-dot:rgba(237,239,244,.075);
    --skeleton-a:#242932;
    --skeleton-b:#2d323d;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 4px 14px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.3);
    --shadow-3:0 18px 44px rgba(0,0,0,.6),0 4px 10px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --paper:#0e1015;
  --stage:#171a21;
  --stage-2:#1d2129;
  --ink:#edeff4;
  --ink-2:#c3c9d6;
  --muted:#98a0b0;
  --line:#2a2f3a;
  --line-soft:#232833;
  --accent:#7ab0ff;
  --accent-ink:#07182e;
  --accent-soft:rgba(122,176,255,.15);
  --accent-line:rgba(122,176,255,.5);
  --measure:#4fd1bd;
  --measure-soft:rgba(79,209,189,.14);
  --ok:#4ade9b;
  --ok-soft:rgba(74,222,155,.13);
  --warn:#e5a53a;
  --warn-soft:rgba(229,165,58,.14);
  --danger:#ff7a6b;
  --danger-soft:rgba(255,122,107,.13);
  --grid-dot:rgba(237,239,244,.075);
  --skeleton-a:#242932;
  --skeleton-b:#2d323d;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 4px 14px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.3);
  --shadow-3:0 18px 44px rgba(0,0,0,.6),0 4px 10px rgba(0,0,0,.4);
}

/* ============================================================
   BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

/* ============================================================
   DECK CHROME
   ============================================================ */
.deck{
  position:fixed;inset:0;
  display:grid;
  grid-template-rows:var(--rail) 1fr var(--rail);
}

.rail{
  display:flex;align-items:center;gap:14px;
  padding:0 clamp(12px,2.5vw,28px);
  background:var(--stage);
  border-bottom:1px solid var(--line);
  min-width:0;
}
.rail--bottom{border-bottom:0;border-top:1px solid var(--line)}

.mark{display:flex;align-items:baseline;gap:9px;min-width:0}
.mark__name{
  font-family:var(--font-display);font-weight:700;font-size:15px;
  letter-spacing:-.01em;white-space:nowrap;
}
.mark__sub{
  font-family:var(--font-mono);font-size:10.5px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.1em;white-space:nowrap;
}
@media (max-width:720px){.mark__sub{display:none}}

/* ruler-style progress */
.ruler{
  flex:1;display:flex;align-items:flex-end;gap:3px;height:22px;
  min-width:0;overflow:hidden;
}
.ruler__tick{
  flex:1 1 0;min-width:2px;height:7px;
  background:var(--line);border:0;padding:0;cursor:pointer;border-radius:1px;
  transition:background .18s,height .18s;
}
.ruler__tick.is-major{height:12px}
.ruler__tick.is-done{background:var(--ink-2)}
.ruler__tick.is-current{background:var(--accent);height:20px}
.ruler__tick:hover{background:var(--accent-line)}

.rail__btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:32px;padding:0 11px;
  background:transparent;border:1px solid var(--line);border-radius:var(--r-sm);
  font-family:var(--font-mono);font-size:11.5px;font-weight:500;
  color:var(--ink-2);cursor:pointer;white-space:nowrap;
  transition:border-color .15s,color .15s,background .15s;
}
.rail__btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.rail__btn:disabled{opacity:.35;cursor:not-allowed}
.rail__btn--icon{width:32px;padding:0}

.counter{
  font-family:var(--font-mono);font-size:12px;color:var(--muted);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.counter b{color:var(--ink);font-weight:600}

.keyhint{
  display:flex;gap:5px;align-items:center;
  font-family:var(--font-mono);font-size:10.5px;color:var(--muted);
}
.kbd{
  display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;
  border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;
  background:var(--stage-2);font-size:10px;font-weight:500;color:var(--ink-2);
}
@media (max-width:1000px){.keyhint{display:none}}

/* ============================================================
   SLIDE SURFACE
   ============================================================ */
.stage{position:relative;overflow:hidden;background:var(--paper)}
.slide{
  position:absolute;inset:0;
  overflow-y:auto;overflow-x:hidden;
  padding:clamp(20px,3.2vw,40px) clamp(16px,3.2vw,44px) 44px;
  opacity:0;visibility:hidden;transform:translateX(22px);
  transition:opacity .26s ease,transform .26s ease,visibility 0s .26s;
}
.slide.is-active{opacity:1;visibility:visible;transform:none;transition:opacity .3s ease,transform .3s ease}
.slide.is-prev{transform:translateX(-22px)}

.slide__inner{max-width:1320px;margin:0 auto}

.eyebrow{
  display:flex;align-items:center;gap:9px;margin-bottom:12px;
  font-family:var(--font-mono);font-size:11px;font-weight:500;
  text-transform:uppercase;letter-spacing:.13em;color:var(--accent);
}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--accent-line);opacity:.45}

.slide h2{
  font-size:clamp(23px,2.9vw,33px);font-weight:700;letter-spacing:-.02em;
  margin-bottom:8px;max-width:36ch;
}
.lede{
  font-size:15px;color:var(--muted);
  max-width:60ch;margin-bottom:clamp(14px,1.8vw,22px);
}

.cols{
  display:grid;gap:clamp(18px,2.4vw,32px);
  grid-template-columns:minmax(0,3.2fr) minmax(0,8.8fr);
  align-items:start;
}
.cols--even{grid-template-columns:minmax(0,3.4fr) minmax(0,8.6fr)}
.cols--wide{grid-template-columns:minmax(0,3.2fr) minmax(0,8.8fr)}
@media (max-width:980px){
  .cols,.cols--even,.cols--wide{grid-template-columns:minmax(0,1fr)}
}

/* ============================================================
   NOTE COLUMN
   ============================================================ */
.note{display:flex;flex-direction:column;gap:13px}
.note p{color:var(--ink-2);max-width:56ch}
.note strong{color:var(--ink);font-weight:600}

.h3{
  font-family:var(--font-display);font-size:16px;font-weight:600;
  letter-spacing:-.005em;margin-bottom:7px;
}

.deflist{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.deflist li{
  display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;
  font-size:13.5px;line-height:1.5;color:var(--ink-2);
}
.deflist .tag{margin-top:2px}

.tag{
  display:inline-block;padding:2px 8px;border-radius:999px;
  font-family:var(--font-mono);font-size:10.5px;font-weight:500;
  letter-spacing:.04em;white-space:nowrap;
  background:var(--accent-soft);color:var(--accent);
}
.tag--cyan{background:var(--measure-soft);color:var(--measure)}
.tag--ok{background:var(--ok-soft);color:var(--ok)}
.tag--warn{background:var(--warn-soft);color:var(--warn)}
.tag--danger{background:var(--danger-soft);color:var(--danger)}
.tag--plain{background:var(--line-soft);color:var(--muted)}

.callout{
  border-left:3px solid var(--accent);
  background:var(--accent-soft);
  padding:10px 13px;border-radius:0 var(--r-sm) var(--r-sm) 0;
  font-size:13.5px;line-height:1.55;color:var(--ink-2);
}
.callout b{color:var(--ink)}
.callout--cyan{border-left-color:var(--measure);background:var(--measure-soft)}
.callout--warn{border-left-color:var(--warn);background:var(--warn-soft)}

code{
  font-family:var(--font-mono);font-size:.88em;
  background:var(--line-soft);padding:1px 5px;border-radius:4px;color:var(--ink);
}

/* ============================================================
   SPECIMEN STAGE
   ============================================================ */
.plate{
  background:var(--stage);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  overflow:hidden;
  box-shadow:var(--shadow-1);
}
.plate__head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:9px 14px;border-bottom:1px solid var(--line-soft);
  background:var(--stage-2);
}
.plate__title{
  font-family:var(--font-mono);font-size:10.5px;font-weight:500;
  letter-spacing:.11em;text-transform:uppercase;color:var(--muted);
}
.plate__body{
  padding:clamp(16px,2.2vw,26px);
  background-image:radial-gradient(var(--grid-dot) 1px,transparent 1px);
  background-size:14px 14px;
  background-position:-1px -1px;
}
.plate__body--flush{padding:0;background-image:none}
.plate + .plate{margin-top:16px}

.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.row--tight{gap:8px}

/* redline annotation */
.redline{
  position:relative;padding-left:18px;
  font-family:var(--font-mono);font-size:11px;color:var(--accent);
  letter-spacing:.02em;
}
.redline::before{
  content:"";position:absolute;left:0;top:.62em;
  width:12px;border-top:1px dashed var(--accent-line);
}

/* controls bar for demos */
.ctl{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding:10px 14px;border-top:1px solid var(--line-soft);background:var(--stage-2);
}
.ctl__label{
  font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;
  letter-spacing:.1em;color:var(--muted);margin-right:2px;
}
.chip{
  padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:var(--stage);
  font-family:var(--font-mono);font-size:11.5px;color:var(--ink-2);cursor:pointer;
  transition:all .15s;
}
.chip:hover{border-color:var(--accent-line);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ctl input[type=range]{accent-color:var(--accent);width:110px}
.ctl .val{font-family:var(--font-mono);font-size:11.5px;color:var(--ink);font-variant-numeric:tabular-nums;min-width:46px}

/* ============================================================
   DEMO COMPONENT KIT  (the things being taught)
   ============================================================ */
.d-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:38px;padding:0 16px;border-radius:var(--r-sm);
  border:1px solid transparent;background:var(--accent);color:var(--accent-ink);
  font-family:var(--font-body);font-size:14px;font-weight:600;cursor:pointer;
  transition:filter .15s,background .15s,border-color .15s,box-shadow .15s;
  white-space:nowrap;
}
.d-btn:hover{filter:brightness(1.08)}
.d-btn:active{filter:brightness(.94)}
.d-btn--secondary{background:var(--line-soft);color:var(--ink);border-color:transparent}
.d-btn--outline{background:transparent;color:var(--ink);border-color:var(--line)}
.d-btn--outline:hover{border-color:var(--accent);color:var(--accent);filter:none}
.d-btn--ghost{background:transparent;color:var(--ink-2)}
.d-btn--ghost:hover{background:var(--line-soft);filter:none}
.d-btn--danger{background:var(--danger);color:#fff}
.d-btn--link{background:transparent;color:var(--accent);text-decoration:underline;text-underline-offset:3px;padding:0;height:auto}
.d-btn--sm{height:30px;padding:0 11px;font-size:12.5px}
.d-btn--lg{height:46px;padding:0 22px;font-size:15.5px}
.d-btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.d-btn.is-focus{outline:2px solid var(--accent);outline-offset:2px}
.d-btn.is-hover{filter:brightness(1.08)}
.d-btn.is-active{filter:brightness(.9);transform:translateY(1px)}

.spin{
  display:inline-block;
  width:14px;height:14px;border-radius:50%;
  border:2px solid currentColor;border-top-color:transparent;
  animation:spin .7s linear infinite;flex:none;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* card */
.d-card{
  background:var(--stage);border:1px solid var(--line);border-radius:var(--r-md);
  overflow:hidden;max-width:330px;
}
.d-card__media{
  height:96px;
  background:
    linear-gradient(115deg,var(--accent-soft),var(--measure-soft)),
    repeating-linear-gradient(45deg,transparent 0 9px,var(--line-soft) 9px 10px);
}
.d-card__body{padding:15px 16px;display:flex;flex-direction:column;gap:7px}
.d-card__title{font-family:var(--font-display);font-size:16px;font-weight:600}
.d-card__text{font-size:13.5px;color:var(--muted);line-height:1.55}
.d-card__actions{display:flex;gap:8px;padding:0 16px 15px}
.d-card.is-lit{outline:2px solid var(--accent);outline-offset:2px}

/* field */
.d-field{display:flex;flex-direction:column;gap:5px;max-width:320px}
.d-field__label{font-size:13px;font-weight:600;color:var(--ink)}
.d-field__label .req{color:var(--danger)}
.d-input{
  height:38px;padding:0 11px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--stage);font-size:14px;transition:border-color .15s,box-shadow .15s;
}
.d-input::placeholder{color:var(--muted);opacity:.75}
.d-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.d-input[aria-invalid="true"]{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
textarea.d-input{height:auto;padding:9px 11px;resize:vertical;min-height:74px;line-height:1.5}
select.d-input{cursor:pointer}
.d-help{font-size:12px;color:var(--muted)}
.d-help--err{color:var(--danger);display:flex;gap:5px;align-items:center}

/* switch */
.d-switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.d-switch__track{
  position:relative;width:42px;height:24px;border-radius:999px;
  background:var(--line);transition:background .2s;flex:none;
}
.d-switch__thumb{
  position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
  background:#fff;box-shadow:var(--shadow-1);transition:transform .2s;
}
.d-switch input{position:absolute;opacity:0;width:0;height:0}
.d-switch input:checked + .d-switch__track{background:var(--ok)}
.d-switch input:checked + .d-switch__track .d-switch__thumb{transform:translateX(18px)}
.d-switch input:focus-visible + .d-switch__track{outline:2px solid var(--accent);outline-offset:2px}
.d-switch__text{font-size:14px}

.d-check,.d-radio{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:14px;user-select:none}
.d-check input,.d-radio input{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;flex:none}

/* segmented */
.d-seg{display:inline-flex;padding:3px;background:var(--line-soft);border-radius:var(--r-sm);gap:2px}
.d-seg button{
  padding:6px 14px;border:0;background:transparent;border-radius:5px;
  font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .15s;
}
.d-seg button[aria-pressed="true"]{background:var(--stage);color:var(--ink);box-shadow:var(--shadow-1)}

/* badges & avatars */
.d-badge{
  display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;
  font-size:12px;font-weight:600;background:var(--line-soft);color:var(--ink-2);
}
.d-badge--ok{background:var(--ok-soft);color:var(--ok)}
.d-badge--warn{background:var(--warn-soft);color:var(--warn)}
.d-badge--danger{background:var(--danger-soft);color:var(--danger)}
.d-badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.d-avatar{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:var(--measure-soft);color:var(--measure);
  font-family:var(--font-display);font-size:13px;font-weight:600;flex:none;
}
.d-chip{
  display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 6px 0 11px;
  border-radius:999px;background:var(--line-soft);font-size:13px;
}
.d-chip button{
  width:18px;height:18px;border-radius:50%;border:0;background:transparent;
  color:var(--muted);cursor:pointer;display:grid;place-items:center;font-size:14px;line-height:1;
}
.d-chip button:hover{background:var(--line);color:var(--ink)}

/* skeleton */
.sk{border-radius:5px;background:linear-gradient(90deg,var(--skeleton-a) 25%,var(--skeleton-b) 37%,var(--skeleton-a) 63%);background-size:400% 100%;animation:shimmer 1.3s ease-in-out infinite}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
.sk--circle{border-radius:50%}

/* progress */
.d-prog{height:7px;border-radius:999px;background:var(--line-soft);overflow:hidden}
.d-prog__bar{height:100%;background:var(--accent);border-radius:999px;transition:width .28s ease}
.d-prog--indet .d-prog__bar{width:38%;animation:indet 1.25s ease-in-out infinite}
@keyframes indet{0%{margin-left:-38%}100%{margin-left:100%}}

/* alerts */
.d-alert{
  display:flex;gap:11px;padding:12px 14px;border-radius:var(--r-sm);
  font-size:13.5px;line-height:1.5;border:1px solid transparent;
}
.d-alert__icon{font-family:var(--font-mono);font-weight:600;flex:none;line-height:1.4}
.d-alert--info{background:var(--measure-soft);color:var(--measure);border-color:var(--measure-soft)}
.d-alert--ok{background:var(--ok-soft);color:var(--ok)}
.d-alert--warn{background:var(--warn-soft);color:var(--warn)}
.d-alert--danger{background:var(--danger-soft);color:var(--danger)}
.d-alert b{display:block;color:inherit}

/* toast host */
.toast-host{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:5;pointer-events:none}
.d-toast{
  display:flex;align-items:center;gap:10px;padding:11px 14px;min-width:230px;
  background:var(--ink);color:var(--paper);border-radius:var(--r-sm);
  box-shadow:var(--shadow-3);font-size:13.5px;
  animation:toastIn .24s cubic-bezier(.2,.9,.3,1);
}
.d-toast.is-out{animation:toastOut .2s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.97)}}
@keyframes toastOut{to{opacity:0;transform:translateY(6px)}}

/* tabs */
.d-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.d-tabs button{
  padding:9px 15px;border:0;background:transparent;cursor:pointer;
  font-size:14px;font-weight:500;color:var(--muted);
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;
}
.d-tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.d-tabpanel{padding:15px 2px;font-size:14px;color:var(--ink-2)}

/* accordion */
.d-acc{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.d-acc__item + .d-acc__item{border-top:1px solid var(--line)}
.d-acc__btn{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 14px;background:transparent;border:0;cursor:pointer;
  font-size:14px;font-weight:600;text-align:left;color:var(--ink);
}
.d-acc__btn:hover{background:var(--stage-2)}
.d-acc__mark{font-family:var(--font-mono);color:var(--accent);transition:transform .2s;flex:none}
.d-acc__btn[aria-expanded="true"] .d-acc__mark{transform:rotate(45deg)}
.d-acc__panel{padding:0 14px 13px;font-size:13.5px;color:var(--muted);line-height:1.6}

/* breadcrumb / pagination / steps */
.d-crumb{display:flex;flex-wrap:wrap;gap:7px;align-items:center;font-size:13px;color:var(--muted)}
.d-crumb a{color:var(--muted);text-decoration:none}
.d-crumb a:hover{color:var(--accent);text-decoration:underline}
.d-crumb [aria-current]{color:var(--ink);font-weight:600}
.d-page{display:flex;gap:4px}
.d-page button{
  min-width:32px;height:32px;padding:0 8px;border:1px solid var(--line);background:var(--stage);
  border-radius:var(--r-sm);font-family:var(--font-mono);font-size:12.5px;cursor:pointer;color:var(--ink-2);
}
.d-page button[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.d-page button:disabled{opacity:.35;cursor:not-allowed}
.d-steps{display:flex;align-items:center;gap:0;flex-wrap:wrap}
.d-step{display:flex;align-items:center;gap:8px}
.d-step__dot{
  width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;
  border:1.5px solid var(--line);font-family:var(--font-mono);font-size:11.5px;color:var(--muted);background:var(--stage);
}
.d-step.is-done .d-step__dot{background:var(--ok);border-color:var(--ok);color:#fff}
.d-step.is-now .d-step__dot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.d-step__label{font-size:13px;color:var(--muted)}
.d-step.is-now .d-step__label{color:var(--ink);font-weight:600}
.d-step__line{width:34px;height:1.5px;background:var(--line);margin:0 9px}
.d-step__line.is-done{background:var(--ok)}

/* table / list */
.d-tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
.d-table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:400px}
.d-table th{
  text-align:left;padding:9px 13px;background:var(--stage-2);color:var(--muted);
  font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:500;
  border-bottom:1px solid var(--line);
}
.d-table td{padding:10px 13px;border-bottom:1px solid var(--line-soft)}
.d-table tr:last-child td{border-bottom:0}
.d-table td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right}

.d-list{display:flex;flex-direction:column;gap:2px}
.d-listitem{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r-sm)}
.d-listitem:hover{background:var(--stage-2)}
.d-listitem__main{flex:1;min-width:0}
.d-listitem__title{font-size:14px;font-weight:500}
.d-listitem__sub{font-size:12.5px;color:var(--muted)}

/* modal / drawer / popover / tooltip */
.overlay-stage{position:relative;height:250px;border-radius:var(--r-sm);overflow:hidden;background:var(--stage-2);border:1px solid var(--line-soft)}
.overlay-stage__bg{padding:16px;display:flex;flex-direction:column;gap:9px}
.overlay-stage__bar{height:9px;border-radius:4px;background:var(--line-soft)}
.scrim{position:absolute;inset:0;background:rgba(10,12,17,.42);display:grid;place-items:center;animation:fade .18s ease}
@keyframes fade{from{opacity:0}}
.d-modal{
  width:min(300px,84%);background:var(--stage);border-radius:var(--r-md);
  box-shadow:var(--shadow-3);padding:18px;display:flex;flex-direction:column;gap:11px;
  animation:pop .2s cubic-bezier(.2,.9,.3,1);
}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
.d-drawer{
  position:absolute;top:0;right:0;bottom:0;width:min(230px,70%);
  background:var(--stage);box-shadow:var(--shadow-3);padding:18px;
  display:flex;flex-direction:column;gap:11px;animation:slideIn .22s cubic-bezier(.2,.9,.3,1);
}
@keyframes slideIn{from{transform:translateX(100%)}}
.d-pop{
  position:absolute;background:var(--stage);border:1px solid var(--line);border-radius:var(--r-sm);
  box-shadow:var(--shadow-2);padding:12px;font-size:13px;width:190px;z-index:3;
  animation:pop .16s ease;
}
.d-tip{
  position:absolute;background:var(--ink);color:var(--paper);padding:5px 9px;border-radius:5px;
  font-size:12px;white-space:nowrap;z-index:3;animation:fade .12s ease;pointer-events:none;
}
.d-menu{
  position:absolute;background:var(--stage);border:1px solid var(--line);border-radius:var(--r-sm);
  box-shadow:var(--shadow-2);padding:5px;min-width:160px;z-index:3;animation:pop .16s ease;
}
.d-menu button{
  display:block;width:100%;text-align:left;padding:7px 10px;border:0;background:transparent;
  border-radius:5px;font-size:13.5px;cursor:pointer;color:var(--ink-2);
}
.d-menu button:hover{background:var(--stage-2);color:var(--ink)}
.d-menu hr{border:0;border-top:1px solid var(--line-soft);margin:5px 0}

/* empty state */
.d-empty{display:flex;flex-direction:column;align-items:center;gap:11px;padding:26px 18px;text-align:center}
.d-empty__art{
  width:52px;height:52px;border-radius:var(--r-md);border:1.5px dashed var(--line);
  display:grid;place-items:center;color:var(--muted);font-family:var(--font-mono);font-size:19px;
}
.d-empty__title{font-family:var(--font-display);font-size:15px;font-weight:600}
.d-empty__text{font-size:13px;color:var(--muted);max-width:34ch}

/* swatches & tokens */
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:9px}
.swatch{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.swatch__chip{height:44px}
.swatch__meta{padding:6px 8px;font-family:var(--font-mono);font-size:10px;line-height:1.45;color:var(--muted)}
.swatch__meta b{display:block;color:var(--ink);font-weight:600;font-size:10.5px}

.scaleview{display:flex;flex-direction:column;gap:9px}
.scalerow{display:flex;align-items:baseline;gap:14px;border-bottom:1px dashed var(--line-soft);padding-bottom:7px}
.scalerow__px{font-family:var(--font-mono);font-size:11px;color:var(--accent);min-width:52px;font-variant-numeric:tabular-nums}
.scalerow__t{font-family:var(--font-display);font-weight:600;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.ratio-out{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-sm);
  background:var(--stage-2);border:1px solid var(--line-soft);flex-wrap:wrap;
}
.ratio-num{font-family:var(--font-mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.preview-box{padding:20px;border-radius:var(--r-sm);display:flex;flex-direction:column;gap:5px;border:1px solid var(--line-soft)}

/* comparison grid */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:620px){.vs{grid-template-columns:1fr}}
.vs__pane{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.vs__head{
  padding:7px 12px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;font-weight:500;
}
.vs__head--bad{background:var(--danger-soft);color:var(--danger)}
.vs__head--good{background:var(--ok-soft);color:var(--ok)}
.vs__body{padding:15px;display:flex;flex-direction:column;gap:11px}

/* cheat sheet */
.sheet-search{
  width:100%;max-width:340px;height:38px;padding:0 13px;
  border:1px solid var(--line);border-radius:var(--r-sm);background:var(--stage);font-size:14px;
}
.sheet-search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sheet{width:100%;border-collapse:collapse;font-size:13.5px;min-width:600px}
.sheet th{
  position:sticky;top:0;text-align:left;padding:9px 13px;background:var(--stage-2);
  font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--muted);font-weight:500;border-bottom:1px solid var(--line);
}
.sheet td{padding:9px 13px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.sheet td:first-child{font-weight:600;white-space:nowrap}
.sheet td.mono{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.sheet tr.is-hidden{display:none}

/* checklist */
.checklist{display:flex;flex-direction:column;gap:3px}
.checkitem{
  display:flex;align-items:flex-start;gap:11px;padding:9px 11px;border-radius:var(--r-sm);
  cursor:pointer;font-size:14px;transition:background .15s;
}
.checkitem:hover{background:var(--stage-2)}
.checkitem input{width:17px;height:17px;margin-top:2px;accent-color:var(--ok);cursor:pointer;flex:none}
.checkitem input:checked + span{color:var(--muted);text-decoration:line-through}

/* overview */
.overview{
  position:fixed;inset:0;z-index:40;background:var(--paper);
  padding:clamp(18px,3vw,36px);overflow-y:auto;
}
.overview[hidden]{display:none}
.overview__grid{
  display:grid;gap:11px;max-width:1100px;margin:0 auto;
  grid-template-columns:repeat(auto-fill,minmax(215px,1fr));
}
.ovcard{
  display:flex;gap:11px;align-items:flex-start;text-align:left;
  padding:13px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--stage);cursor:pointer;transition:all .15s;
}
.ovcard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow-2)}
.ovcard__n{font-family:var(--font-mono);font-size:11px;color:var(--accent);font-weight:600;flex:none;padding-top:2px}
.ovcard__t{font-family:var(--font-display);font-size:14px;font-weight:600;line-height:1.35}
.ovcard.is-current{border-color:var(--accent);background:var(--accent-soft)}


.ic{width:18px;height:18px;flex:none;display:block}
/* range slider สองหัว — ซ้อน input สองตัวบนรางเดียว ให้จับได้เฉพาะหัวจับ */
.dual{position:relative;height:26px;width:100%}
.dual__track,.dual__fill{position:absolute;top:11px;height:4px;border-radius:2px}
.dual__track{left:0;right:0;background:var(--line-soft)}
.dual__fill{background:var(--accent)}
.dual input[type=range]{
  position:absolute;left:0;top:0;width:100%;height:26px;margin:0;
  -webkit-appearance:none;appearance:none;background:transparent;pointer-events:none;
}
.dual input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.dual input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;pointer-events:auto;cursor:grab;
  width:15px;height:15px;border-radius:50%;background:var(--stage);
  border:2px solid var(--accent);box-shadow:var(--shadow-1);
}
.dual input[type=range]::-moz-range-thumb{
  pointer-events:auto;cursor:grab;
  width:15px;height:15px;border-radius:50%;background:var(--stage);
  border:2px solid var(--accent);box-shadow:var(--shadow-1);
}
.d-btn .ic{width:17px;height:17px}

/* ============================================================
   BOARD — กระดานโชว์ component (พระเอกของทุกสไลด์)
   ============================================================ */
.board{
  background:var(--stage);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow-1);
  padding:clamp(16px,2.2vw,26px);
  background-image:radial-gradient(var(--grid-dot) 1px,transparent 1px);
  background-size:14px 14px;background-position:-1px -1px;
}
.grid{display:grid;gap:clamp(14px,1.8vw,22px)}
.grid--2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid--3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid--4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.grid--4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid--3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.grid--2,.grid--3,.grid--4{grid-template-columns:minmax(0,1fr)}}

/* ช่องวางของแต่ละชิ้น */
.cell{
  display:flex;flex-direction:column;gap:9px;align-items:flex-start;
  padding:13px;border-radius:var(--r-md);
  background:var(--stage);border:1px solid var(--line-soft);
  transition:border-color .2s;
}
.cell--wide{grid-column:1/-1}
.cell__name{
  font-family:var(--font-mono);font-size:10.5px;font-weight:500;
  letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
}
.cell__demo{display:flex;flex-wrap:wrap;gap:9px;align-items:center;width:100%}
.cell.is-lit{border-color:var(--accent)}

/* ============================================================
   TOUR — ไฮไลต์ + ลูกศร + ก่อนหน้า/ถัดไป
   ============================================================ */
.tourlayer{position:absolute;inset:0;pointer-events:none;z-index:30}
.tourlayer[hidden]{display:none}

.spot{
  position:absolute;border-radius:10px;pointer-events:none;
  border:2px solid var(--accent);
  box-shadow:0 0 0 4px var(--accent-soft);
  transition:top .28s cubic-bezier(.4,0,.2,1),left .28s cubic-bezier(.4,0,.2,1),
             width .28s cubic-bezier(.4,0,.2,1),height .28s cubic-bezier(.4,0,.2,1);
}
/* ม่านมืด 4 ชิ้นล้อมรอบจุดไฮไลต์ — คุมได้แน่นอนกว่า box-shadow spread ที่ถูก overflow ตัด */
.veil{position:absolute;background:rgba(8,10,16,.58);pointer-events:none;
  transition:top .28s cubic-bezier(.4,0,.2,1),left .28s cubic-bezier(.4,0,.2,1),
             width .28s cubic-bezier(.4,0,.2,1),height .28s cubic-bezier(.4,0,.2,1);
}
:root[data-theme="dark"] .veil{background:rgba(0,0,0,.66)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .veil{background:rgba(0,0,0,.66)}
}

.bubble{
  position:absolute;width:min(340px,74vw);
  background:var(--stage);border:1px solid var(--accent-line);
  border-radius:var(--r-md);box-shadow:var(--shadow-3);
  padding:15px 16px 13px;pointer-events:auto;
  transition:top .3s cubic-bezier(.4,0,.2,1),left .3s cubic-bezier(.4,0,.2,1);
}
.bubble__arrow{
  position:absolute;width:13px;height:13px;background:var(--stage);
  border-left:1px solid var(--accent-line);border-top:1px solid var(--accent-line);
}
.bubble__arrow[data-dir="up"]{top:-7px;transform:rotate(45deg)}
.bubble__arrow[data-dir="down"]{bottom:-7px;transform:rotate(225deg)}
.bubble__arrow[data-dir="left"]{left:-7px;transform:rotate(-45deg)}
.bubble__arrow[data-dir="right"]{right:-7px;transform:rotate(135deg)}

.bubble__step{
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.09em;
  color:var(--accent);font-weight:500;margin-bottom:5px;
}
.bubble__name{
  font-family:var(--font-display);font-size:19px;font-weight:700;
  letter-spacing:-.01em;line-height:1.25;
}
.bubble__th{font-size:13px;color:var(--measure);font-weight:600;margin-top:1px}
.bubble__use{font-size:13.5px;color:var(--ink-2);line-height:1.55;margin-top:7px}
.bubble__foot{
  display:flex;align-items:center;gap:7px;margin-top:13px;
  padding-top:11px;border-top:1px solid var(--line-soft);
}
.bubble__dots{display:flex;gap:3px;flex:1;flex-wrap:wrap}
.bubble__dot{width:5px;height:5px;border-radius:50%;background:var(--line);flex:none}
.bubble__dot.is-on{background:var(--accent)}
.bubble__dot.is-past{background:var(--ink-2)}

.tbtn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  height:30px;padding:0 12px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--stage);
  font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;
  transition:all .15s;white-space:nowrap;
}
.tbtn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.tbtn:disabled{opacity:.35;cursor:not-allowed}
.tbtn--go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tbtn--go:hover{filter:brightness(1.08);color:var(--accent-ink)}
.tbtn--x{width:30px;padding:0;font-size:15px}

/* ปุ่มเปิดทัวร์ตอนปิดอยู่ */
.tourbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin-bottom:13px;
}
.tourbar__hint{font-size:13px;color:var(--muted)}

.slidehead{margin-bottom:clamp(12px,1.6vw,18px)}

/* หน้าปก — จัดกลางจอ ไม่มีกระดานตัวอย่าง */
.uxui{display:grid;grid-template-columns:minmax(0,252px) minmax(0,1fr);gap:clamp(14px,1.8vw,20px);align-items:stretch}
.uxui__side{display:flex;flex-direction:column;gap:clamp(12px,1.4vw,16px);min-height:0}
.uxui__cases{display:flex;flex-direction:column;gap:3px;width:100%;flex:1;min-height:120px;overflow-y:auto;padding-right:3px}
.uxui__case{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:9px 11px;border:1px solid transparent;border-radius:var(--r-sm);
  background:transparent;font-size:14px;font-weight:500;color:var(--ink-2);cursor:pointer;
  transition:background .15s,color .15s,border-color .15s;
}
.uxui__case:hover{background:var(--stage-2);color:var(--ink)}
.uxui__case[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:600}
.uxui__num{
  display:grid;place-items:center;width:22px;height:22px;flex:none;border-radius:50%;
  background:var(--line-soft);color:var(--muted);font-family:var(--font-mono);font-size:11.5px;
}
.uxui__case[aria-pressed="true"] .uxui__num{background:var(--accent);color:var(--accent-ink)}
.uxui__main{gap:12px}
.uxui__head{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%}
.uxui__screen{
  width:100%;min-height:clamp(300px,42vh,420px);
  border:1px solid var(--line);transition:padding .15s,border-radius .15s,background .15s;
}
@media (max-width:900px){
  .uxui{grid-template-columns:minmax(0,1fr)}
  .uxui__cases{flex-direction:row;flex-wrap:wrap}
  .uxui__case{width:auto}
}

.cover{
  min-height:100%;display:grid;place-content:center;justify-items:center;
  text-align:center;gap:clamp(14px,2vw,22px);
}
.cover__eyebrow{
  font-family:var(--font-mono);font-size:11.5px;font-weight:500;
  text-transform:uppercase;letter-spacing:.18em;color:var(--accent);
}
.cover__title{
  font-family:var(--font-display);font-weight:700;letter-spacing:-.025em;
  font-size:clamp(34px,6vw,68px);line-height:1.1;max-width:16ch;
}
.cover__sub{
  font-size:clamp(15px,1.5vw,19px);color:var(--ink-2);
  max-width:44ch;line-height:1.6;
}
.cover__rule{width:56px;height:2px;background:var(--accent);border-radius:2px}
.cover__keys{
  display:flex;flex-wrap:wrap;justify-content:center;gap:7px;align-items:center;
  font-size:12.5px;color:var(--muted);
}

    list.innerHTML = CASES.map((c, i) =>
      '<button class="uxui__case" data-case="' + i + '" aria-pressed="' + (i === 0) + '">' +
      '<span class="uxui__num">' + (i + 1) + '</span>' + c.name + '</button>').join('');

    function paint(){
      const c = CASES[at];
      const ux = swUx.checked, ui = swUi.checked;
      const key = (ux ? '1' : '0') + (ui ? '1' : '0');

      screen.innerHTML = c.render(ux, ui);
      screen.style.background = ui ? 'var(--stage)' : '#fbfbfb';
      screen.style.borderRadius = ui ? '10px' : '2px';
      screen.style.padding = ui ? 'clamp(20px,2.4vw,30px)' : '14px';

      titleEl.textContent = c.title;
      note.textContent = c.note[key];

      const V = {
        '00': ['พังทั้งคู่', 'tag--danger'],
        '10': ['UX ผ่าน · UI พัง', 'tag--warn'],
        '01': ['UI ผ่าน · UX พัง', 'tag--warn'],
        '11': ['ผ่านทั้งคู่', 'tag--ok']
      };
      verdict.textContent = V[key][0];
      verdict.className = 'tag ' + V[key][1];
    }

    qa(list, '[data-case]').forEach((b) => b.addEventListener('click', () => {
      qa(list, '[data-case]').forEach((o) => o.setAttribute('aria-pressed', String(o === b)));
      at = Number(b.dataset.case);
      // เปลี่ยนสถานการณ์แล้วเริ่มจาก "พังทั้งคู่" ใหม่ทุกครั้ง
      swUx.checked = false;
      swUi.checked = false;
      paint();
    }));
    swUx.addEventListener('change', paint);
    swUi.addEventListener('change', paint);
    paint();
  }
});

    tabs.forEach((b, i) => b.addEventListener('click', () => {
      tabs.forEach((o) => o.setAttribute('aria-selected', String(o === b)));
      tabpanel.textContent = T[i];
    }));

    // pagination
    const pager = q(root, '[data-c="pager"] .d-page');
    let page = 1;
    const paintPager = () => {
      pager.innerHTML = '<button data-p="prev"' + (page === 1 ? ' disabled' : '') + '>‹</button>' +
        [1, 2, 3].map((n) => '<button data-p="' + n + '"' + (n === page ? ' aria-current="page"' : '') + '>' + n + '</button>').join('') +
        '<button data-p="next"' + (page === 3 ? ' disabled' : '') + '>›</button>';
      qa(pager, '[data-p]').forEach((b) => b.addEventListener('click', () => {
        const v = b.dataset.p;
        page = v === 'prev' ? Math.max(1, page - 1) : v === 'next' ? Math.min(3, page + 1) : Number(v);
        paintPager();
      }));
    };
    paintPager();

    // stepper — กดที่ขั้นเพื่อย้าย
    const stepCell = q(root, '[data-c="stepper"] .d-steps');
    const LABELS = ['ตะกร้า', 'ชำระเงิน', 'เสร็จ'];
    let cur = 1;
    const paintSteps = () => {
      stepCell.innerHTML = LABELS.map((l, i) => {
        const state = i < cur ? 'is-done' : i === cur ? 'is-now' : '';
        return (i ? '<span class="d-step__line ' + (i <= cur ? 'is-done' : '') + '"></span>' : '') +
          '<span class="d-step ' + state + '" data-s="' + i + '" style="cursor:pointer"><span class="d-step__dot">' + (i < cur ? '✓' : i + 1) + '</span><span class="d-step__label">' + l + '</span></span>';
      }).join('');
      qa(stepCell, '[data-s]').forEach((el) => el.addEventListener('click', () => { cur = Number(el.dataset.s); paintSteps(); }));
    };
    paintSteps();

    // sidebar + bottom nav — เลือกได้
    const pick = (sel, onPick) => {
      const items = qa(root, sel);
      items.forEach((it) => {
        it.style.cursor = 'pointer';
        it.addEventListener('click', () => { items.forEach((o) => onPick(o, o === it)); });
      });
    };
    pick('[data-c="sidebar"] .d-listitem', (el, on) => {
      el.style.background = on ? 'var(--accent-soft)' : '';
      el.style.color = on ? 'var(--accent)' : 'var(--muted)';
      el.style.fontWeight = on ? '600' : '';
    });
    pick('[data-c="bottomnav"] .cell__demo > span', (el, on) => {
      el.style.color = on ? 'var(--accent)' : 'var(--muted)';
      el.style.fontWeight = on ? '600' : '';
    });
  }
});

  init(root){

    const runSearch = () => {
      const t = sIn.value.trim();
      sClear.hidden = !t;
      if (!t){ sOut.textContent = 'พิมพ์เพื่อค้นหาจากเมนู ' + MENU.length + ' รายการ'; return; }
      const hit = MENU.filter((m) => m.includes(t));
      sOut.innerHTML = hit.length
        ? 'พบ ' + hit.length + ' รายการ · ' + hit.map((m) => '<span class="d-badge" style="margin:2px 3px 0 0">' + m + '</span>').join('')
        : '<span style="color:var(--danger)">ไม่พบ “' + t + '” — ลองคำอื่นหรือลบตัวกรองบางอัน</span>';
    };
    sIn.addEventListener('input', runSearch);
    sClear.addEventListener('click', () => { sIn.value = ''; runSearch(); sIn.focus(); });
    runSearch();

    // --- combobox: กรองตามที่พิมพ์ + เลือกด้วยเมาส์หรือคีย์บอร์ด ---
    const cIn = q(root, '[data-combo]');
    const cList = q(root, '[data-combolist]');
    let active = -1, shown = [];
    const closeList = () => { cList.innerHTML = ''; shown = []; active = -1; cIn.setAttribute('aria-expanded', 'false'); };
    const choose = (v) => { cIn.value = v; closeList(); };
    const paintList = () => {
      const t = cIn.value.trim();
      shown = t ? MENU.filter((m) => m.includes(t)) : MENU.slice(0, 5);
      if (!shown.length){
        cList.innerHTML = '<div style="border:1px solid var(--line);border-top:0;border-radius:0 0 6px 6px;padding:9px 11px;font-size:13px;color:var(--muted)">ไม่พบเมนูที่ตรงกับ “' + t + '”</div>';
        return;
      }
      cList.innerHTML = '<div style="border:1px solid var(--line);border-top:0;border-radius:0 0 6px 6px;padding:4px;max-height:150px;overflow:auto">' +
        shown.map((m, i) =>
          '<div data-opt="' + i + '" style="padding:6px 9px;border-radius:5px;font-size:13.5px;cursor:pointer;' +
          (i === active ? 'background:var(--accent-soft);color:var(--accent);font-weight:600' : 'color:var(--ink-2)') + '">' + m + '</div>'
        ).join('') + '</div>';
      qa(cList, '[data-opt]').forEach((el) => {
        el.addEventListener('mousedown', (e) => { e.preventDefault(); choose(shown[Number(el.dataset.opt)]); });
        el.addEventListener('mouseenter', () => { active = Number(el.dataset.opt); paintList(); });
      });
    };
    cIn.addEventListener('focus', () => { active = -1; paintList(); });
    cIn.addEventListener('input', () => { active = -1; paintList(); });
    cIn.addEventListener('blur', () => setTimeout(closeList, 120));
    cIn.addEventListener('keydown', (e) => {
      if (!shown.length && e.key !== 'ArrowDown') return;
      if (e.key === 'ArrowDown'){ e.preventDefault(); if (!shown.length) paintList(); active = Math.min(shown.length - 1, active + 1); paintList(); }
      else if (e.key === 'ArrowUp'){ e.preventDefault(); active = Math.max(0, active - 1); paintList(); }
      else if (e.key === 'Enter'){ if (active >= 0){ e.preventDefault(); choose(shown[active]); } }
      else if (e.key === 'Escape'){ closeList(); }
    });

    const n = q(root, '[data-note]'), c = q(root, '[data-count]');
    if (n) n.addEventListener('input', () => { c.textContent = String(n.value.length); });
    const pw = q(root, '[data-pw]'), eye = q(root, '[data-pweye]');
    if (eye) eye.addEventListener('click', () => {
      pw.type = pw.type === 'password' ? 'text' : 'password';
      eye.setAttribute('aria-label', pw.type === 'password' ? 'แสดงรหัสผ่าน' : 'ซ่อนรหัสผ่าน');
    });
  }
});

  ],

    const lo = q(root, '[data-lo]'), hi = q(root, '[data-hi]');
    const fill = q(root, '[data-fill]'), rOut = q(root, '[data-range-out]');
    const paintRange = () => {
      let a = Number(lo.value), b = Number(hi.value);
      if (a > b - 20){ if (document.activeElement === lo) { a = b - 20; lo.value = String(a); } else { b = a + 20; hi.value = String(b); } }
      const max = Number(lo.max);
      fill.style.left = (a / max * 100) + '%';
      fill.style.right = (100 - b / max * 100) + '%';
      rOut.textContent = '฿' + a.toLocaleString('en-US') + ' – ฿' + b.toLocaleString('en-US');
    };
    lo.addEventListener('input', paintRange);
    hi.addEventListener('input', paintRange);
    paintRange();

    const qty = q(root, '[data-qty]'), qtyOut = q(root, '[data-qty-out]');
    const sync = () => {
      let n = parseInt(qty.value, 10);
      if (!Number.isFinite(n) || n < 1) n = 1;
      if (n > 99) n = 99;
      qty.value = String(n);
      qtyOut.textContent = 'รวม ฿' + (n * 120).toLocaleString('en-US');
    };
    qa(root, '[data-step]').forEach((b) => b.addEventListener('click', () => {
      qty.value = String((parseInt(qty.value, 10) || 1) + Number(b.dataset.step)); sync();
    }));
    qty.addEventListener('change', sync); sync();

    const stars = qa(root, '[data-star]'), rateOut = q(root, '[data-rate-out]');
    let rating = 0;
    const paint = (n) => stars.forEach((s, i) => { s.style.color = i < n ? 'var(--warn)' : 'var(--line)'; });
    stars.forEach((s) => {
      s.addEventListener('click', () => {
        const n = Number(s.dataset.star);
        rating = rating === n ? 0 : n; paint(rating);
        rateOut.textContent = rating ? rating + ' จาก 5 ดาว' : 'เต็ม 5 ดาว';
      });
      s.addEventListener('mouseenter', () => paint(Number(s.dataset.star)));
    });
    q(root, '[data-rate]').addEventListener('mouseleave', () => paint(rating));
    paint(0);

    const cal = q(root, '[data-cal]');
    cal.innerHTML = Array.from({ length: 30 }, (_, i) => {
      const d = i + 1;
      const on = d === 12;
      return '<span style="padding:4px 0;border-radius:5px;' + (on ? 'background:var(--accent);color:var(--accent-ink);font-weight:600' : 'color:var(--ink-2)') + '">' + d + '</span>';
    }).join('');
  }
});

      host.appendChild(el);
      setTimeout(() => { el.classList.add('is-out'); setTimeout(() => el.remove(), 200); }, 2600);
    };
    q(root, '[data-fire="ok"]').addEventListener('click', () => toast('บันทึกฉบับร่างแล้ว', 'var(--ok)'));
    q(root, '[data-fire="undo"]').addEventListener('click', () => {
      const el = document.createElement('div');
      el.className = 'd-toast'; el.style.pointerEvents = 'auto';
      el.innerHTML = '<span>ย้าย 1 รายการไปถังขยะ</span><button class="d-btn d-btn--link d-btn--sm" style="color:var(--accent);margin-left:auto">เลิกทำ</button>';
      host.appendChild(el);
      const kill = () => { el.classList.add('is-out'); setTimeout(() => el.remove(), 200); };
      el.querySelector('button').addEventListener('click', () => { kill(); toast('กู้คืนแล้ว', 'var(--ok)'); });
      setTimeout(kill, 4200);
    });

    const tb = q(root, '[data-tip]');
    let tip = null;
    const show = () => {
      if (tip) return;
      tip = document.createElement('div');
      tip.className = 'd-tip'; tip.textContent = tb.dataset.tip;
      tb.parentElement.style.position = 'relative';
      tip.style.left = '0px'; tip.style.top = (tb.offsetTop + tb.offsetHeight + 6) + 'px';
      tb.parentElement.appendChild(tip);
    };
    const hide = () => { if (tip){ tip.remove(); tip = null; } };
    tb.addEventListener('mouseenter', show); tb.addEventListener('focus', show);
    tb.addEventListener('mouseleave', hide); tb.addEventListener('blur', hide);

    // ปุ่มปิด banner
    const bannerCell = q(root, '[data-c="banner"]');

      const m = document.createElement('div');
      m.className = 'd-menu';
      m.style.left = (e.clientX - r.left) + 'px';

  tour: [
    { c2: 'statusbar', name: 'Status bar', th: 'แถบสถานะของเครื่อง', use: 'แถบบนสุดของระบบ (เวลา แบต สัญญาณ) — เราออกแบบทับไม่ได้ แต่ต้องเผื่อที่ไว้' },
    { c2: 'tabbar', name: 'Tab bar / Bottom navigation', th: 'แถบเมนูล่าง', use: 'เมนูหลัก 3–5 อันที่ก้นจอ — นิ้วโป้งเอื้อมถึงง่ายที่สุด' },
    { c2: 'fab', name: 'FAB — Floating Action Button', th: 'ปุ่มลอย', use: 'ปุ่มกลมลอยมุมล่างขวา สำหรับการกระทำหลักหนึ่งอย่างของหน้านั้น' },
    { c: 'ptr', name: 'Pull to refresh', th: 'ลากลงเพื่อรีเฟรช', use: 'ลากนิ้วลงจากบนสุดเพื่อโหลดข้อมูลใหม่ — เป็นมาตรฐานที่ผู้ใช้คาดหวังแล้ว' },

    { c: 'sheet', name: 'Action sheet', th: 'แผงตัวเลือกจากด้านล่าง', use: 'ลิสต์ตัวเลือกที่เลื่อนขึ้นจากก้นจอ พร้อมปุ่มยกเลิกล่างสุด' },
    { c: 'segmob', name: 'Segmented control', th: 'ปุ่มกลุ่มสลับ', use: 'บนมือถือมักยืดเต็มความกว้าง เพื่อให้พื้นที่กดใหญ่พอ' },

  ],
  init(root){
    const body = q(root, '[data-phonebody]');
    const clearPhone = () => qa(body, '[data-pop]').forEach((n) => n.remove());

    // tab bar — เลือกได้
    const tabs = qa(root, '[data-c2="tabbar"] > span');
    tabs.forEach((t) => {
      t.style.cursor = 'pointer';
      t.addEventListener('click', () => tabs.forEach((o) => { o.style.color = o === t ? 'var(--accent)' : 'var(--muted)'; }));
    });

    // FAB — เปิด action sheet ในเครื่อง
    q(root, '[data-c2="fab"]').addEventListener('click', (e) => {
      e.stopPropagation();
      if (q(body, '[data-pop="sheet"]')){ clearPhone(); return; }
      clearPhone();
      const el = document.createElement('div');
      el.dataset.pop = 'sheet';
      el.style.cssText = 'position:absolute;left:0;right:0;bottom:0;background:var(--stage);border-top:1px solid var(--line);border-radius:10px 10px 0 0;padding:8px;box-shadow:var(--shadow-2)';
      el.innerHTML = '<div style="width:26px;height:3px;border-radius:2px;background:var(--line);margin:0 auto 7px"></div>' +

        '<div style="padding:6px 8px;font-size:11.5px;color:var(--ink-2)">เลือกจากคลัง</div>' +
        '<div data-close style="padding:6px 8px;font-size:11.5px;color:var(--danger);font-weight:600;cursor:pointer">ยกเลิก</div>';
      body.appendChild(el);
      el.querySelector('[data-close]').addEventListener('click', clearPhone);
    });

    // hamburger ในเครื่อง — เปิด drawer
    q(root, '[data-phoneburger]').addEventListener('click', (e) => {
      e.stopPropagation();
      if (q(body, '[data-pop="drawer"]')){ clearPhone(); return; }
      clearPhone();
      const el = document.createElement('div');
      el.dataset.pop = 'drawer';
      el.style.cssText = 'position:absolute;left:0;top:0;bottom:0;width:66%;background:var(--stage);border-right:1px solid var(--line);padding:9px;box-shadow:var(--shadow-2);display:flex;flex-direction:column;gap:6px';
      el.innerHTML = '<div style="font-size:11.5px;font-weight:600">เมนู</div>' +
        '<div style="font-size:11.5px;color:var(--muted)">โปรโมชัน</div>' +
        '<div style="font-size:11.5px;color:var(--muted)">สาขา</div>' +
        '<div data-close style="margin-top:auto;font-size:11.5px;color:var(--accent);cursor:pointer">ปิด</div>';
      body.appendChild(el);
      el.querySelector('[data-close]').addEventListener('click', clearPhone);
    });

    // pull to refresh — กดเพื่อจำลอง
    const ptr = q(root, '[data-c="ptr"] .cell__demo');
    ptr.style.cursor = 'pointer';
    ptr.addEventListener('click', () => {
      const note = ptr.querySelector('.d-help');
      note.textContent = 'กำลังโหลดใหม่…';
      setTimeout(() => { note.textContent = 'อัปเดตล่าสุดเมื่อสักครู่ · กดอีกครั้งเพื่อลองใหม่'; }, 1200);
    });

    // swipe action — กดเพื่อเปิด/ปิดปุ่มลบ
    const swipe = q(root, '[data-c="swipe"] .cell__demo > div');
    const del = swipe.lastElementChild;
    let open = true;
    swipe.style.cursor = 'pointer';
    swipe.addEventListener('click', () => {
      open = !open;
      del.style.width = open ? '60px' : '0px';
      del.style.overflow = 'hidden';
      del.style.transition = 'width .2s';
    });

    // action sheet — เลือกได้
    qa(root, '[data-c="sheet"] .cell__demo > div > div').forEach((r) => {
      r.style.cursor = 'pointer';
      r.addEventListener('click', () => {
        r.style.background = 'var(--accent-soft)';
        setTimeout(() => { r.style.background = ''; }, 220);
      });
    });

    // segmented
    const seg = qa(root, '[data-c="segmob"] .d-seg button');
    seg.forEach((b) => b.addEventListener('click', () => seg.forEach((o) => o.setAttribute('aria-pressed', String(o === b)))));

    const off = () => clearPhone();
    document.addEventListener('click', off);
    return () => document.removeEventListener('click', off);
  }
});

/* ============================================================
   ENGINE — สไลด์ + ทัวร์
   ============================================================ */
(function(){
  const stage = document.getElementById('stage');
  const ruler = document.getElementById('ruler');
  const cNow = document.getElementById('cNow');
  const cAll = document.getElementById('cAll');
  const slideName = document.getElementById('slideName');
  const btnPrev = document.getElementById('btnPrev');
  const btnNext = document.getElementById('btnNext');
  const btnOverview = document.getElementById('btnOverview');
  const btnCloseOverview = document.getElementById('btnCloseOverview');
  const btnTheme = document.getElementById('btnTheme');
  const overview = document.getElementById('overview');
  const overviewGrid = document.getElementById('overviewGrid');

  const THAI = /[฀-๿]/;
  const MONO = '.eyebrow,.cell__name,.tag,.d-table th,.sheet th,.counter,.plate__title';
  function markThai(scope){
    scope.querySelectorAll(MONO).forEach((el) => {
      if (THAI.test(el.textContent) && !el.classList.contains('is-th')) el.classList.add('is-th');
    });
  }
  let queued = false;
  new MutationObserver(() => {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; markThai(stage); });
  }).observe(stage, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['class'] });

  const built = new Array(SLIDES.length).fill(false);
  const cleanups = new Array(SLIDES.length).fill(null);
  const tours = new Array(SLIDES.length).fill(null);
  let cur = 0;

  SLIDES.forEach(() => {
    const el = document.createElement('section');
    el.className = 'slide';
    el.setAttribute('aria-hidden', 'true');
    stage.appendChild(el);
  });
  const els = Array.from(stage.children);

  function build(i){
    if (built[i]) return;
    const s = SLIDES[i];
    const steps = s.tour || [];
    if (s.cover){
      els[i].innerHTML = '<div class="slide__inner cover">' + s.board + '</div>';
      markThai(els[i]);
      if (s.init){ try { cleanups[i] = s.init(els[i]) || null; } catch (err){ console.error('cover init', err); } }
      built[i] = true;
      return;
    }
    els[i].innerHTML =
      '<div class="slide__inner">' +
        '<div class="slidehead">' +
          '<div class="eyebrow">' + s.eyebrow + '</div>' +
          '<h2>' + s.h2 + '</h2>' +
          '<p class="lede">' + s.lead + '</p>' +
        '</div>' +
        (steps.length
          ? '<div class="tourbar">' +
              '<button class="tbtn tbtn--go" data-starttour>▶ เริ่มทัวร์ · ' + steps.length + ' จุด</button>' +
              '<span class="tourbar__hint">หรือกดเล่นในกระดานได้เลย</span>' +
            '</div>'
          : '') +
        '<div class="tourwrap" style="position:relative">' +
          '<div class="board">' + s.board + '</div>' +
          '<div class="tourlayer" hidden>' +
            '<div class="veil" data-v="t"></div><div class="veil" data-v="b"></div>' +
            '<div class="veil" data-v="l"></div><div class="veil" data-v="r"></div>' +
            '<div class="spot"></div>' +
            '<div class="bubble">' +
              '<span class="bubble__arrow"></span>' +
              '<div class="bubble__step"></div>' +
              '<div class="bubble__name"></div>' +
              '<div class="bubble__th"></div>' +
              '<div class="bubble__use"></div>' +
              '<div class="bubble__foot">' +
                '<span class="bubble__dots"></span>' +
                '<button class="tbtn" data-tback>← ก่อนหน้า</button>' +
                '<button class="tbtn tbtn--go" data-tnext>ถัดไป →</button>' +
                '<button class="tbtn tbtn--x" data-tclose aria-label="ปิดทัวร์">×</button>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    markThai(els[i]);
    if (s.init){
      try { cleanups[i] = s.init(els[i]) || null; }
      catch (err){ console.error('slide ' + (i + 1) + ' init', err); }
    }
    if (steps.length) tours[i] = makeTour(els[i], steps, i);
    built[i] = true;
  }

  /* ---------------- tour ---------------- */
  function makeTour(root, steps, slideIndex){
    const wrap = root.querySelector('.tourwrap');
    const layer = root.querySelector('.tourlayer');
    const spot = root.querySelector('.spot');
    const veils = {
      t: root.querySelector('[data-v="t"]'), b: root.querySelector('[data-v="b"]'),
      l: root.querySelector('[data-v="l"]'), r: root.querySelector('[data-v="r"]')
    };
    const bubble = root.querySelector('.bubble');
    const arrow = root.querySelector('.bubble__arrow');
    const elStep = root.querySelector('.bubble__step');
    const elName = root.querySelector('.bubble__name');
    const elTh = root.querySelector('.bubble__th');
    const elUse = root.querySelector('.bubble__use');
    const dots = root.querySelector('.bubble__dots');
    const bBack = root.querySelector('[data-tback]');
    const bNext = root.querySelector('[data-tnext]');
    const bClose = root.querySelector('[data-tclose]');
    const startBtn = root.querySelector('[data-starttour]');

    let idx = -1;
    let lit = null;

    dots.innerHTML = steps.map(() => '<span class="bubble__dot"></span>').join('');
    const dotEls = Array.from(dots.children);

    const targetOf = (st) => wrap.querySelector('[data-c="' + (st.c || st.c2) + '"], [data-c2="' + (st.c2 || st.c) + '"]');

    function place(){
      const st = steps[idx];
      const target = targetOf(st);
      if (!target) return;

      const wr = wrap.getBoundingClientRect();
      const tr = target.getBoundingClientRect();
      const pad = 6;
      const top = tr.top - wr.top - pad;
      const left = tr.left - wr.left - pad;
      const w = tr.width + pad * 2;
      const h = tr.height + pad * 2;

      spot.style.top = top + 'px';
      spot.style.left = left + 'px';
      spot.style.width = w + 'px';
      spot.style.height = h + 'px';

      const W = wr.width, H = wr.height;
      const box = (el, x, y, bw, bh) => {
        el.style.left = Math.max(0, x) + 'px';
        el.style.top = Math.max(0, y) + 'px';
        el.style.width = Math.max(0, bw) + 'px';
        el.style.height = Math.max(0, bh) + 'px';
      };
      box(veils.t, 0, 0, W, top);
      box(veils.b, 0, top + h, W, H - (top + h));
      box(veils.l, 0, top, left, h);
      box(veils.r, left + w, top, W - (left + w), h);

      const bw = bubble.offsetWidth || 320;
      const bh = bubble.offsetHeight || 160;
      const gap = 15;
      let bTop, dir;
      if (top + h + gap + bh <= wr.height){ bTop = top + h + gap; dir = 'up'; }
      else if (top - gap - bh >= 0){ bTop = top - gap - bh; dir = 'down'; }
      else { bTop = Math.max(8, Math.min(wr.height - bh - 8, top)); dir = null; }

      const centre = left + w / 2 - bw / 2;
      const bLeft = Math.max(8, Math.min(wr.width - bw - 8, centre));
      bubble.style.top = bTop + 'px';
      bubble.style.left = bLeft + 'px';

      if (dir){
        arrow.hidden = false;
        arrow.dataset.dir = dir;
        const ax = Math.max(14, Math.min(bw - 26, left + w / 2 - bLeft - 6));
        arrow.style.left = ax + 'px';
        arrow.style.right = 'auto';
      } else {
        arrow.hidden = true;
      }
    }

    function show(n){
      if (n < 0 || n >= steps.length) return;
      idx = n;
      const st = steps[idx];

      if (lit) lit.classList.remove('is-lit');
      const target = targetOf(st);
      const cellEl = target && target.closest ? target.closest('.cell') : null;
      lit = cellEl;
      if (lit) lit.classList.add('is-lit');

      elStep.textContent = 'จุดที่ ' + (idx + 1) + ' / ' + steps.length;
      elName.textContent = st.name;
      elTh.textContent = st.th;
      elUse.textContent = st.use;
      dotEls.forEach((d, i) => {
        d.classList.toggle('is-on', i === idx);
        d.classList.toggle('is-past', i < idx);
      });
      bBack.disabled = false;
      bNext.textContent = idx === steps.length - 1 ? 'สไลด์ถัดไป →' : 'ถัดไป →';

      layer.hidden = false;
      if (target && target.scrollIntoView) target.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      requestAnimationFrame(() => requestAnimationFrame(place));
    }

    function start(n){ show(n === 'last' ? steps.length - 1 : (typeof n === 'number' ? n : 0)); }
    function stop(){
      layer.hidden = true;
      idx = -1;
      if (lit){ lit.classList.remove('is-lit'); lit = null; }
    }

    startBtn.addEventListener('click', () => start(0));
    bClose.addEventListener('click', stop);
    bNext.addEventListener('click', () => {
      if (idx === steps.length - 1){ stop(); go(slideIndex + 1); }
      else show(idx + 1);
    });
    bBack.addEventListener('click', () => {
      if (idx === 0){ stop(); go(slideIndex - 1); }
      else show(idx - 1);
    });

    const onResize = () => { if (!layer.hidden) place(); };
    window.addEventListener('resize', onResize);

    return {
      active: () => !layer.hidden,
      start, stop,
      next: () => bNext.click(),
      back: () => bBack.click(),
      dispose: () => window.removeEventListener('resize', onResize)
    };
  }

  /* ---------------- ruler + overview ---------------- */
  SLIDES.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'ruler__tick' + ((i + 1) % 5 === 0 ? ' is-major' : '');
    b.type = 'button';
    b.title = (i + 1) + '. ' + s.title;
    b.setAttribute('aria-label', 'ไปสไลด์ ' + (i + 1) + ': ' + s.title);
    b.addEventListener('click', () => go(i));
    ruler.appendChild(b);

    const c = document.createElement('button');
    c.className = 'ovcard';
    c.type = 'button';
    c.innerHTML = '<span class="ovcard__n">' + String(i + 1).padStart(2, '0') + '</span><span class="ovcard__t">' + s.title + '</span>';
    c.addEventListener('click', () => { closeOverview(); go(i); });
    overviewGrid.appendChild(c);
  });
  const ticks = Array.from(ruler.children);
  const ovcards = Array.from(overviewGrid.children);
  cAll.textContent = String(SLIDES.length);

  function go(i){
    if (i < 0 || i >= SLIDES.length) return;
    if (tours[cur] && tours[cur].active()) tours[cur].stop();
    build(i);
    if (i + 1 < SLIDES.length) build(i + 1);

    els.forEach((el, n) => {
      el.classList.toggle('is-active', n === i);
      el.classList.toggle('is-prev', n < i);
      el.setAttribute('aria-hidden', String(n !== i));
    });
    ticks.forEach((t, n) => {
      t.classList.toggle('is-current', n === i);
      t.classList.toggle('is-done', n < i);
    });
    ovcards.forEach((c, n) => c.classList.toggle('is-current', n === i));

    cur = i;
    cNow.textContent = String(i + 1);
    slideName.textContent = SLIDES[i].title;
    btnPrev.disabled = i === 0;
    btnNext.disabled = i === SLIDES.length - 1;
    els[i].scrollTop = 0;
    markThai(els[i]);
    try { history.replaceState(null, '', '#' + (i + 1)); } catch {}

  }

  function openOverview(){ overview.hidden = false; btnCloseOverview.focus(); }
  function closeOverview(){ overview.hidden = true; }

  btnPrev.addEventListener('click', () => go(cur - 1));
  btnNext.addEventListener('click', () => go(cur + 1));
  btnOverview.addEventListener('click', () => overview.hidden ? openOverview() : closeOverview());
  btnCloseOverview.addEventListener('click', closeOverview);

  function applyTheme(t){
    if (t === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('uilab:theme', t); } catch {}
  }
  // เปิดมาเป็นธีมสว่างเสมอ ไม่ตามระบบ — ปุ่ม ◐ สลับเป็น มืด / ตามระบบ ได้
  let theme = 'light';
  try { theme = localStorage.getItem('uilab:theme') || 'light'; } catch {}
  applyTheme(theme);
  btnTheme.addEventListener('click', () => {
    theme = theme === 'light' ? 'dark' : theme === 'dark' ? 'auto' : 'light';
    applyTheme(theme);
  });

  document.addEventListener('keydown', (e) => {
    const tag = (e.target && e.target.tagName) || '';
    if (e.key === 'Escape'){
      if (!overview.hidden){ closeOverview(); return; }
      if (tours[cur] && tours[cur].active()){ tours[cur].stop(); return; }
    }
    if (/INPUT|TEXTAREA|SELECT/.test(tag)) return;

    const t = tours[cur];
    if (e.key === 'ArrowRight' || e.key === 'PageDown'){
      e.preventDefault();
      if (t && t.active()) t.next(); else go(cur + 1);
    } else if (e.key === 'ArrowLeft' || e.key === 'PageUp'){
      e.preventDefault();
      if (t && t.active()) t.back(); else go(cur - 1);
    } else if (e.key === 'Home'){ e.preventDefault(); go(0); }
    else if (e.key === 'End'){ e.preventDefault(); go(SLIDES.length - 1); }
    else if (e.key === 'g' || e.key === 'G'){ overview.hidden ? openOverview() : closeOverview(); }
    else if (e.key === 't' || e.key === 'T'){ btnTheme.click(); }
    else if (e.key === ' ' && t && !t.active()){ e.preventDefault(); t.start(0); }
  });

  DECK.go = go;

  const fromHash = () => Math.max(0, Math.min(SLIDES.length - 1, (parseInt(location.hash.slice(1), 10) || 1) - 1));
  window.addEventListener('hashchange', () => { const i = fromHash(); if (i !== cur) go(i); });
  go(fromHash());
})();
</script>

</body>
</html>
